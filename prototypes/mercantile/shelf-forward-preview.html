const regions=[[29.5,10.7,10,11.5],[41.9,10.7,10.8,11.5],[54.3,10.7,10.5,11.5],[29.5,22.8,10,12],[41.9,22.8,10.8,12],[54.3,22.8,10.5,12],[29.5,35.2,10,12],[41.9,35.2,10.8,12],[54.3,35.2,10.5,12]];
const $=id=>document.getElementById(id);let current=-1,previousFocus=null,productFocus=null,leaving=false,page=0;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imgSrc(p){return '../../'+p.img}
function openShelf(i,button){current=i;page=0;previousFocus=button;const r=regions[i];$('shelf').style.setProperty('--origin-x',r[0]+r[2]/2+'%');$('shelf').style.setProperty('--origin-y',r[1]+r[3]/2+'%');$('shelf-title').textContent=CATALOG[i].title;$('shelf-sub').textContent=CATALOG[i].items.length+' products · '+CATALOG[i].sub;const useDouble=CATALOG[i].items.length>6;$('shelf-stage').className='shelf-stage '+(useDouble?'double':'single');$('shelf-art').src='../../assets/mercantile/'+(useDouble?'Pullman_Expanded_2_Shelves.jpg':'Pullman_Expanded_1_Shelves.jpg');renderProducts();$('shelf-layer').classList.remove('retreat');show('shelf-layer');$('return-panorama').focus({preventScroll:true})}
function renderProducts(){const items=CATALOG[current].items,offset=page*12,visible=items.slice(offset,offset+12);$('products').innerHTML=visible.map((p,j)=>'<button class="product-tile" data-item="'+(offset+j)+'" type="button" title="'+esc(p.name)+'" aria-label="View '+esc(p.name)+'"><img loading="lazy" src="'+esc(imgSrc(p))+'" alt=""><span>'+esc(p.name)+'</span></button>').join('');const pages=Math.ceil(items.length/12);$('shelf-pager').hidden=pages<=1;$('page-prev').disabled=page===0;$('page-next').disabled=page>=pages-1;$('page-count').textContent='Shelf '+(page+1)+' of '+pages;}
function show(id){$(id).classList.add('active');$(id).setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function hide(id){$(id).classList.remove('active');$(id).setAttribute('aria-hidden','true');if(!$('shelf-layer').classList.contains('active')&&!$('product-layer').classList.contains('active'))document.body.style.overflow=''}
function openProduct(i,button){productFocus=button;const p=CATALOG[current].items[i];$('focus-img').src=imgSrc(p);$('focus-img').alt=p.name;$('focus-title').textContent=p.name;$('focus-category').textContent=CATALOG[current].sub;if(p.link){$('product-page').href='../../'+p.link;$('product-page').hidden=false;}else{$('product-page').hidden=true;}show('product-layer');$('return-shelf').focus({preventScroll:true})}
function backProduct(){hide('product-layer');productFocus?.focus({preventScroll:true})}
function backShelf(){if(leaving)return;if($('product-layer').classList.contains('active')){backProduct();return}leaving=true;$('shelf-layer').classList.add('retreat');const finish=()=>{hide('shelf-layer');$('shelf-layer').classList.remove('retreat');leaving=false;previousFocus?.focus({preventScroll:true})};if(matchMedia('(prefers-reduced-motion: reduce)').matches)finish();else setTimeout(finish,290)}
$('scene').addEventListener('click',e=>{const b=e.target.closest('[data-dept]');if(b)openShelf(Number(b.dataset.dept),b)});
$('products').addEventListener('click',e=>{const b=e.target.closest('[data-item]');if(b)openProduct(Number(b.dataset.item),b)});
$('page-prev').addEventListener('click',()=>{if(page>0){page--;renderProducts();}});$('page-next').addEventListener('click',()=>{if((page+1)*12<CATALOG[current].items.length){page++;renderProducts();}});$('return-shelf').addEventListener('click',backProduct);$('return-panorama').addEventListener('click',backShelf);
$('guide').addEventListener('click',e=>{const on=$('scene').classList.toggle('show-guides');e.currentTarget.textContent=on?'Hide clickable areas':'Show clickable areas'});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('product-layer').classList.contains('active'))backProduct();else if($('shelf-layer').classList.contains('active'))backShelf()});
</script></body></html>
