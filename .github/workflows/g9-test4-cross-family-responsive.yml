name: G9 Test 4 cross-family responsive and checkout-guard regression
on:
  push:
    branches: [Sauce-Bar-Dev]
    paths:
      - 'tools/g9-state-badges/tests/verify-test4-cross-family-responsive.mjs'
      - '.github/workflows/g9-test4-cross-family-responsive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test4:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependency
        run: npm install --no-save --no-package-lock playwright@1.57.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test real Dev HTML responsive award UI, auth routing and cart guards
        run: node tools/g9-state-badges/tests/verify-test4-cross-family-responsive.mjs
