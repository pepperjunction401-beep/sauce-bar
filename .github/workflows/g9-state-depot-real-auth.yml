name: G9 Testing-only real-auth Depot browser verification
# One-time runtime-generated test account in isolated Supabase Testing
on:
  push:
    branches: [Sauce-Bar-Dev]
    paths: ['.github/workflows/g9-state-depot-real-auth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-auth-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only packages
        run: npm install --no-save --no-package-lock playwright@1.57.0 @supabase/supabase-js@2.77.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise real Testing authentication and verified State Depot
        run: node tools/g9-state-badges/browser/verify-authenticated-depot.mjs
