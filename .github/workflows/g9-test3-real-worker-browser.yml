name: G9 Test 3 isolated real worker recovery browser
on:
  push:
    branches: [Sauce-Bar-Dev]
    paths: ['.github/workflows/g9-test3-real-worker-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g9-real-worker-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      G9_TEST3_ACK: SUPERVISED_TESTING_ONLY_CLEANUP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --no-save --no-package-lock playwright@1.57.0 @supabase/supabase-js@2.77.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Supervised real Testing Auth and G9 worker recovery while Chromium page remains open
        run: node tools/g9-state-badges/post-payment/verify-test3-live-recovery.mjs
