name: G9 strict release candidate gate
on:
  push:
    branches: [release/g9-state-only-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g9-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact G9-only payload, frozen Loyalty, and unchanged live architecture
        run: node tools/g9-release-tmp/verify-isolation.mjs
      - name: Install pinned test-only dependencies
        run: npm install --no-save --no-package-lock playwright@1.57.0 typescript@5.9.3
      - name: Check actual candidate server source (production origin isolation)
        run: node tools/g9-release-tmp/verify-server-g9.mjs
      - name: Install headless browser
        run: npx playwright install --with-deps chromium
      - name: Check candidate State Depot UI and earned-only secrets
        run: node tools/g9-release-tmp/verify-depot.mjs
      - name: Check candidate post-payment page and async retry
        run: node tools/g9-release-tmp/verify-postpayment-browser.mjs
