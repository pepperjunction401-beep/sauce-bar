
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pepper Junction — Welcome Aboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0700;
    }

    /* ── Image fills everything ───────────────────────────────── */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    /* ── Buttons sit over the image ───────────────────────────── */
    .buttons {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      opacity: 0;
      animation: rise 0.9s ease 0.6s forwards;
    }

    .btn {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      text-decoration: none;
      color: #1a1008;
      background: #c49a3c;
      border: 1px solid #d4a832;
      padding: 14px 38px;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.22s ease, color 0.22s ease, transform 0.22s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: #d4a832;
      color: #0d0700;
      transform: translateY(-2px);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateX(-50%) translateY(14px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Mobile ───────────────────────────────────────────────── */
    @media (max-width: 540px) {
      html, body { overflow: auto; }
      .stage { height: 100svh; }
      .stage img { object-position: 70% 20%; }
      .buttons {
        flex-direction: column;
        align-items: center;
        bottom: 8%;
        gap: 16px;
      }
      .btn { width: 220px; text-align: center; }
    }

  </style>
</head>
<body>

  <div class="stage">

    <img src="assets/Landing_page_image_Pullman.png"
         alt="NYNH&H Pullman parlor car conductor welcoming passengers aboard" />

    <div class="buttons">
      <a class="btn" href="main.html">Main</a>
      <a class="btn" href="index.html">Pairing Bar</a>
    </div>

  </div>

  <!-- Return visitor cookie — skip conductor on second visit -->
  <script>
    (function () {
      const COOKIE  = 'pj_last_dest';
      const MAX_AGE = 60 * 60 * 24 * 30; // 30 days

      function getCookie(name) {
        const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return m ? decodeURIComponent(m[2]) : null;
      }

      function setCookie(name, val) {
        document.cookie = name + '=' + encodeURIComponent(val) +
          '; max-age=' + MAX_AGE + '; path=/; SameSite=Lax';
      }

      // Save destination on click
      document.querySelectorAll('.btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setCookie(COOKIE, btn.getAttribute('href'));
        });
      });

      // Return visitor — go straight there
      const saved = getCookie(COOKIE);
      if (saved) window.location.replace(saved);
    })();
  </script>

</body>
</html>
