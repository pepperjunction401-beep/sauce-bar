
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pepper Junction — Welcome Aboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0700;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #0d0700;
      display: block;
    }

    /* ── Greeting — center-right, just left of door/handrail ─── */
    .greeting {
      position: absolute;
      top: 52%;
      left: 22%;
      text-align: left;
      opacity: 0;
      animation: rise 0.9s ease 0.3s forwards;
    }

    .greeting-main {
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 4.5vw, 60px);
      font-weight: 900;
      font-style: italic;
      color: #f4e8d0;
      letter-spacing: 0.02em;
      line-height: 1.1;
      display: block;
      margin-bottom: 12px;
      text-shadow: 0 2px 14px rgba(0,0,0,0.8);
    }

    .greeting-sub {
      font-family: 'Playfair Display', serif;
      font-size: clamp(16px, 2vw, 26px);
      font-weight: 700;
      font-style: italic;
      color: #f4e8d0;
      opacity: 0.85;
      letter-spacing: 0.03em;
      line-height: 1.4;
      display: block;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* ── Buttons ──────────────────────────────────────────────── */
    .buttons {
      position: absolute;
      bottom: 10%;
      left: 50%;
      display: flex;
      gap: 24px;
      opacity: 0;
      animation: rise-centered 0.9s ease 0.6s forwards;
      transform: translateX(-50%);
    }

    .btn {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      text-decoration: none;
      color: #1a1008;
      background: #c49a3c;
      border: 1px solid #d4a832;
      padding: 14px 38px;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.22s ease, color 0.22s ease, transform 0.22s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: #d4a832;
      color: #0d0700;
      transform: translateY(-2px);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes rise-centered {
      from { opacity: 0; transform: translateX(-50%) translateY(14px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Mobile ───────────────────────────────────────────────── */
    @media (max-width: 640px) {
      html, body { overflow: auto; }
      .stage { height: 100svh; }
      .greeting {
        top: 28%;
        left: 5%;
      }
      .greeting-sub { white-space: normal; }
      .buttons {
        flex-direction: column;
        align-items: center;
        bottom: 8%;
        gap: 16px;
      }
      .btn { width: 220px; text-align: center; }
    }

  </style>
</head>
<body>

  <div class="stage">

    <img src="assets/Landing_page_image_Pullman.png"
         alt="NYNH&H Pullman parlor car conductor welcoming passengers aboard" />

   <div class="greeting">
      <span class="greeting-main">Welcome Aboard.</span>
      <span class="greeting-sub">Have a seat at the Main Page or the Pairing Bar.</span>
      <div class="buttons">
        <a class="btn" href="main.html">Main</a>
        <a class="btn" href="index.html">Pairing Bar</a>
      </div>
    </div>
   </div>

</body>
</html>
